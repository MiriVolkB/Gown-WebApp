# Nightly backup of the production database.
# Saves a password-locked (encrypted) copy as a workflow artifact, kept for 30 days.
# Never commits a copy to the repo, and never prints the database address or any data.
name: Nightly database backup

on:
  schedule:
    - cron: "17 23 * * *" # 23:17 UTC = about 01:17 (winter) / 02:17 (summer) Israel time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Both secrets PROD_DATABASE_URL and BACKUP_PASSPHRASE must be set in Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$DATABASE_URL" in
            *:6543/*)
              echo "::error::PROD_DATABASE_URL uses port 6543 (Transaction pooler). Use the Session pooler address (port 5432) instead."
              exit 1
              ;;
          esac

      - name: Install the Postgres 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null

      - name: Copy the database and lock it
        id: backup
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup

          # Errors are shown with anything in quotes or brackets hidden,
          # so the database address and customer data never reach the log.
          redact() { sed -E 's#postgres(ql)?://[^ ]*#<address hidden>#g; s/"[^"]*"/"..."/g; s/'"'"'[^'"'"']*'"'"'/'"'"'...'"'"'/g; s/\([^)]*\)/(...)/g'; }

          if ! /usr/lib/postgresql/17/bin/pg_dump --dbname="$DATABASE_URL" \
              --schema=public --format=custom --no-owner --no-privileges \
              --file=backup/db.dump 2> backup/dump.err; then
            echo "::error::The database copy failed. Details (address and data hidden):"
            grep -iE "error|fatal" backup/dump.err | head -5 | redact
            echo "If it says the network is unreachable, PROD_DATABASE_URL is probably the direct address. Use the Session pooler address."
            exit 1
          fi

          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 \
            --output backup/db.dump.gpg backup/db.dump 3<<< "$BACKUP_PASSPHRASE"
          rm backup/db.dump backup/dump.err

          echo "Locked backup size: $(du -h backup/db.dump.gpg | cut -f1)"
          echo "name=db-backup-$(date -u +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Save the locked copy (kept 30 days)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.backup.outputs.name }}
          path: backup/db.dump.gpg
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
